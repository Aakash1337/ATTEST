name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The non-negotiables from README.md, enforced mechanically rather than by review:
      #   - packages/core has zero AWS imports
      #   - every query on a tenant-scoped table filters tenant + ACL in-query
      #   - every table with tenant_id has RLS enabled AND forced
      - name: Static checks
        run: npm run ci:checks
